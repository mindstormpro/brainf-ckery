[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"
[project]
name = "brainf-ckery_mindstormpro3"
version = "1.0.2"
authors = [
  { name="Elio A.", email="elioanon20@Proton.me" },
]
description = "A compiler to compile brainf#ck into assembly and then a native executable for windows. Requires NASM and gcc."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/pypa/sampleproject"
Issues = "https://github.com/pypa/sampleproject/issues"
[project.scripts]
bfc = "brainf_ckery_mindstormpro3.main:run"